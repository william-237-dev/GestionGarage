<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXITECH | Enregistrement d'une personne</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-body-tertiary">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-primary navbar-dark shadow">
    <div class="container">

        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-car-front-fill me-2"></i>
            AXITECH GARAGE
        </a>

    </div>
</nav>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-9">

            <div class="card border-0 shadow-lg">

                <div class="card-header bg-primary text-white py-3">

                    <h3 class="mb-0">
                        <i class="bi bi-person-plus-fill me-2"></i>
                        Enregistrement d'une personne
                    </h3>

                    <small>Veuillez renseigner toutes les informations.</small>

                </div>

                <div class="card-body p-4">

                    <form action="/gestiongarage/personne" method="post">

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">
                                    Nom
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-person"></i>
                                    </span>

                                    <input
                                            type="text"
                                            class="form-control"
                                            name="nom"
                                            placeholder="Ex : Tchantchou"
                                            required>

                                </div>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Prénom
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-person-fill"></i>
                                    </span>

                                    <input
                                            type="text"
                                            class="form-control"
                                            name="prenom"
                                            placeholder="Ex : William"
                                            required>

                                </div>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Email
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-envelope"></i>
                                    </span>

                                    <input
                                            type="email"
                                            class="form-control"
                                            name="email"
                                            placeholder="exemple@gmail.com">

                                </div>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Téléphone
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-telephone"></i>
                                    </span>

                                    <input
                                            type="tel"
                                            class="form-control"
                                            name="telephone"
                                            placeholder="6XXXXXXXX">

                                </div>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Date de naissance
                                </label>

                                <input
                                        type="date"
                                        class="form-control"
                                        name="dateNaissance">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Sexe
                                </label>

                                <select class="form-select" name="sexe">

                                    <option value="">Choisir...</option>

                                    <option value="Masculin">
                                        Masculin
                                    </option>

                                    <option value="Feminin">
                                        Féminin
                                    </option>

                                </select>

                            </div>

                            <div class="col-12 mb-3">

                                <label class="form-label fw-semibold">
                                    Adresse
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-geo-alt"></i>
                                    </span>

                                    <input
                                            type="text"
                                            class="form-control"
                                            name="adresse"
                                            placeholder="Votre adresse">

                                </div>

                            </div>

                            <div class="col-12 mb-3">

                                <label class="form-label fw-semibold">
                                    Profession
                                </label>

                                <input
                                        type="text"
                                        class="form-control"
                                        name="profession"
                                        placeholder="Ex : Mécanicien">

                            </div>

                            <div class="col-12 mb-4">

                                <label class="form-label fw-semibold">
                                    Observations
                                </label>

                                <textarea
                                        class="form-control"
                                        rows="4"
                                        name="observation"
                                        placeholder="Informations complémentaires..."></textarea>

                            </div>

                        </div>

                        <hr>

                        <div class="d-flex justify-content-end gap-3">

                            <button
                                    type="reset"
                                    class="btn btn-outline-secondary">

                                <i class="bi bi-arrow-counterclockwise"></i>

                                Annuler

                            </button>

                            <button
                                    type="submit"
                                    class="btn btn-primary px-4">

                                <i class="bi bi-floppy-fill"></i>

                                Enregistrer

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
