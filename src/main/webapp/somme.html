<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AXITECH | Calculateur de Somme</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

<!-- Barre de navigation -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

    <div class="container">

        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-calculator-fill me-2"></i>
            AXITECH
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card border-0 shadow-lg">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">
                        <i class="bi bi-plus-circle-fill me-2"></i>
                        Calcul de deux nombres
                    </h3>

                </div>

                <div class="card-body p-4">

                    <form action="/www.axitech.com/somme" method="post">

                        <div class="mb-4">

                            <label class="form-label fw-semibold">

                                Premier nombre

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-123"></i>

                                </span>

                                <input
                                        type="number"
                                        class="form-control"
                                        name="number1"
                                        placeholder="Entrer le premier nombre"
                                        required>

                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-semibold">

                                Deuxième nombre

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-123"></i>

                                </span>

                                <input
                                        type="number"
                                        class="form-control"
                                        name="number2"
                                        placeholder="Entrer le deuxième nombre"
                                        required>

                            </div>

                        </div>

                        <div class="d-grid">

                            <button class="btn btn-primary btn-lg">

                                <i class="bi bi-calculator-fill me-2"></i>

                                Calculer

                            </button>

                        </div>

                    </form>

                </div>

                <div class="card-footer text-center text-muted">

                    © 2026 AXITECH - Système de Gestion

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
